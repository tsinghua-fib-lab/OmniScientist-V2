# Same test run from the repository root as from ``cli``.
#
# The project's own settings live in ``cli/pyproject.toml``, which ships inside
# the sdist and is what ``cd cli && pytest`` picks up. pytest only searches the
# invocation path's *ancestors* for a config file, so a run started at the
# repository root — which is what CI does, `uv run --project cli pytest` does
# not change directory — never sees it: async fixtures silently fell back to
# strict mode and ``testpaths`` stopped applying, pulling in the skills' own
# test suites.
#
# The two files are kept identical by
# ``cli/tests/unit/test_repository_hygiene.py``; edit them together.
[pytest]
asyncio_mode = auto
testpaths = cli/tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    release_gate: evidence-heavy release criteria run by the dedicated CI gate
