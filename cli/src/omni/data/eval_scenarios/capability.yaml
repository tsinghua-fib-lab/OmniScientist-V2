- id: livefigure_missing_vlm_configuration
  title: "Editable LiveFigure execution returns one missing-VLM action"
  channel: cli
  tags: [capability_selection, configuration, safety]
  turns:
    - user: "做一页可编辑的 PPT 科研架构图。"
      drain: true
      plan:
        intent_type: single_skill_task
        required_capabilities: [figure.editable.pptx]
        capability_inputs:
          figure.editable.pptx: {input: "one-slide editable research architecture figure"}
        outputs: [artifact.pptx]
        execution_mode: background
        confidence: 0.95
        rationale: "the user explicitly requested an editable one-slide PPT figure"
      expect:
        skill_selected: livefigure
        skills_executed_exclude: [livefigure, scientific-figure]
        action_required: {kind: configure, command: "omni config vlm"}

- id: native_synthesis_drain
  title: "Research workflow drains to a native synthesis draft offline"
  channel: cli
  tags: [capability_selection, execution]
  fixtures: [literature.search, paper.fetch.arxiv, artifact.figure]
  turns:
    - user: "做一个小型综述：检索文献、取一篇 arXiv 论文、画架构图，最后写成研究段落。"
      plan:
        intent_type: workflow
        confidence: 0.92
        workflow_steps:
          - {id: lit, capability: literature.search, input: {query: "retrieval augmented generation"}}
          - {id: paper, capability: paper.fetch.arxiv, depends_on: [lit], input: {identifier: "1706.03762"}}
          - {id: fig, capability: artifact.figure, depends_on: [paper], input: {input: "RAG architecture figure"}}
          - {id: final, capability: synthesis.final, depends_on: [fig], input: {deliverable: draft.section}}
        outputs: [draft.section]
        execution_mode: background
        provenance_mode: light
        rationale: "end-to-end offline drain"
      tool_calls:
        - name: run_workflow
          args:
            goal: "检索文献、取一篇 arXiv 论文、画架构图，最后写成研究段落"
            mode: foreground
            steps:
              - {id: lit, capability: literature.search, input: {query: "retrieval augmented generation"}}
              - {id: paper, capability: paper.fetch.arxiv, depends_on: [lit], input: {identifier: "1706.03762"}}
              - {id: fig, capability: artifact.figure, depends_on: [paper], input: {input: "RAG architecture figure"}}
              - {id: final, capability: synthesis.final, depends_on: [fig], deliverable: draft.section, input: {}}
      drain: true
      expect:
        capabilities_executed: [literature.search, paper.fetch.arxiv, artifact.figure, synthesis.final]

# Prompt-only skills carry no capability slot, so the deterministic explicit
# ``$name`` boundary (not the capability arbitrator) is their routing path. These
# keep the active-skill manifest and the routing corpus in exact agreement.
- id: soulagent_explicit_routing
  title: "An explicit $soulagent request routes to the persona runtime"
  channel: cli
  tags: [routing]
  turns:
    - user: "$soulagent 请以这位科学家的人格来协助我。"
      expect:
        skill_selected: soulagent

- id: scientist_kg_distiller_explicit_routing
  title: "An explicit $scientist-kg-distiller request routes to the KG distiller"
  channel: cli
  tags: [routing]
  turns:
    - user: "$scientist-kg-distiller 为这位科学家构建可追溯的学术人格知识图谱。"
      expect:
        skill_selected: scientist-kg-distiller
