# Capability-selection scenarios keep two questions separate: provider choices
# come from the validated plan, while execution checks come only from submitted
# or drained work. Explicit fixtures make the execution cases offline.
#
# Multi-step scenarios are model-driven: the semantic planner classifies the
# request as multi-step and hands the turn to the capable assistant, and the
# *model* sequences the work by calling ``run_workflow`` (``tool_calls``). The
# plan block still carries the steps the model proposed — it is what routes the
# turn — but the capability evidence now comes from the workflow run the tool
# created, so these scenarios assert ``capabilities_executed`` rather than the
# plan-time ``capabilities_include`` a pre-computed DAG used to supply.

- id: ideation_livefigure_workflow
  title: "Search, ideation, and editable one-slide figure run as one workflow"
  channel: cli
  tags: [capability_selection]
  fixtures: [literature.search, research.ideation, figure.editable.pptx]
  turns:
    - user: "检索关于 RAG 幻觉的文献，提出研究方向，并做成单页可编辑科研图。"
      plan:
        intent_type: workflow
        confidence: 0.9
        workflow_steps:
          - {id: lit, capability: literature.search, input: {query: "RAG hallucination"}}
          - {id: idea, capability: research.ideation, depends_on: [lit], input: {input: "RAG hallucination research directions"}}
          - {id: figure, capability: figure.editable.pptx, depends_on: [idea], input: {input: "one-slide editable RAG research figure"}}
        outputs: [artifact.pptx]
        execution_mode: background
        rationale: "search, ideate, then render an editable scientific figure"
      tool_calls:
        - name: run_workflow
          args:
            goal: "检索 RAG 幻觉文献、提出研究方向、渲染单页可编辑科研图"
            mode: foreground
            steps:
              - {id: lit, capability: literature.search, input: {query: "RAG hallucination"}}
              - {id: idea, capability: research.ideation, depends_on: [lit], input: {input: "RAG hallucination research directions"}}
              - {id: figure, capability: figure.editable.pptx, depends_on: [idea], input: {input: "one-slide editable RAG research figure"}}
      drain: true
      expect:
        capabilities_executed: [literature.search, research.ideation, figure.editable.pptx]

- id: complete_research_deck_routing
  title: "A complete research talk resolves the multi-slide deck capability"
  channel: cli
  tags: [capability_selection]
  turns:
    - user: "为 RAG 事实一致性组会生成一套完整幻灯片。"
      plan:
        intent_type: single_skill_task
        required_capabilities: [slides.generate]
        capability_inputs:
          slides.generate: {topic: "RAG factual consistency group meeting"}
        outputs: [artifact.slides]
        execution_mode: background
        confidence: 0.93
        rationale: "the user requested a complete multi-slide research deck"
      expect:
        skill_selected: research-pptx

- id: scientific_poster_routing
  title: "A complete conference poster resolves the scientific-poster provider"
  channel: cli
  tags: [routing, capability_selection]
  turns:
    - user: "Turn my supplied paper into a complete conference poster with an HTML preview."
      plan:
        intent_type: single_skill_task
        required_capabilities: [poster.scientific]
        capability_inputs:
          poster.scientific: {input: "Create an evidence-grounded conference poster from the supplied paper."}
        outputs: [artifact.poster]
        execution_mode: background
        confidence: 0.96
        rationale: "the requested deliverable is a complete scientific poster"
      expect:
        skill_selected: scientific-poster
        capabilities_include: [poster.scientific]

- id: paper_review_routing
  title: "Pre-submission critique resolves the paper-review provider"
  channel: cli
  tags: [routing, capability_selection]
  turns:
    # The paper is named in the request: this scenario asks whether "review my
    # paper" resolves to the right provider, not whether the planner may invent
    # a file to review. A request that supplies no source is a different
    # scenario with a different right answer — see run 138c7b6e, where the
    # planner made one up and the review came out of the model's memory.
    - user: "Review paper.pdf for NeurIPS before submission and identify likely reject reasons."
      plan:
        intent_type: single_skill_task
        required_capabilities: [review.paper]
        capability_inputs:
          review.paper: {input: "paper.pdf", venue: "NeurIPS", mode: standard}
        outputs: [review]
        execution_mode: background
        confidence: 0.96
        rationale: "the user requested a venue-aware pre-submission paper review"
      expect:
        skill_selected: paper-review
        capabilities_include: [review.paper]

- id: review_response_routing
