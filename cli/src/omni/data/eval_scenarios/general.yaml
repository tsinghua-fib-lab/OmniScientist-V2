# Persona: general — everyday assistant use by a non-researcher. Closes the
# non-research corners of the net: a plain direct answer (grounding), a
# deterministic "remember this" gate (no model call), and the IM-presentation
# guardrail that internal serialization fields never leak to a chat channel.

- id: gen_direct_answer
  title: "General user: direct answer returns user-facing text"
  persona: general
  channel: cli
  tags: [routing, grounding]
  turns:
    - user: "你好，帮我用一句话解释什么是向量数据库。"
      expect:
        text_contains: ["Completed."]

- id: gen_remember_pref
  title: "General user: semantic planner records an explicit preference"
  persona: general
  channel: cli
  tags: [routing]
  turns:
    - user: "帮我记住：以后回答尽量简洁，先给结论再展开。"
      plan:
        intent_type: memory_update
        required_capabilities: [memory.update]
        capability_inputs:
          memory.update:
            content: "以后回答尽量简洁，先给结论再展开。"
        outputs: [memory]
        execution_mode: direct
        confidence: 0.98
        rationale: "The user explicitly asked to retain a durable response preference."
      expect:
        planner_calls: 1
        text_contains: ["Remembered:"]

- id: gen_wechat_presentation
  title: "General user (WeChat): internal fields do not leak into IM presentation"
  persona: general
  channel: wechat
  tags: [presentation]
  fixtures: [literature.search, artifact.figure]
  turns:
    - user: "帮我把 RAG 综述任务跑起来：先检索文献，再画一张系统架构图。"
      plan:
        intent_type: workflow
        confidence: 0.9
        workflow_steps:
          - {id: lit, capability: literature.search, input: {query: "retrieval augmented generation"}}
          - {id: fig, capability: artifact.figure, depends_on: [lit], input: {input: "RAG architecture figure"}}
        outputs: [report]
        execution_mode: background
        rationale: "IM research workflow; presentation must not leak internals"
      tool_calls:
        - name: run_workflow
          args:
            goal: "检索文献，再画一张系统架构图"
            mode: foreground
            steps:
              - {id: lit, capability: literature.search, input: {query: "retrieval augmented generation"}}
              - {id: fig, capability: artifact.figure, depends_on: [lit], input: {input: "RAG architecture figure"}}
      drain: true
      expect:
        capabilities_executed: [literature.search, artifact.figure]
        im_hides: ["input_json", "trace_log", "verification_plan"]

# L4 journey: the owner is asked before a destructive command and says no; the
# approval gate blocks it (nothing runs). Exercises the ``safety`` dimension for
# the everyday-user persona.
- id: gen_safety_destructive_denied
  title: "General user: destructive command is denied by human review"
  persona: general
  channel: cli
  tags: [safety]
  turns:
    - user: "帮我把下载目录腾空一下。"
      approve: deny
      tool_calls:
        - {name: bash, args: {command: "rm -rf ~/Downloads"}}
      expect:
        safety: blocked

# L4 journey (provenance): everyday user asks to note where a result came from;
# the agent binds the note to the supplied sources so the output is traceable.
- id: gen_provenance_capsule_from_sources
  title: "General user: bind sources to a conclusion for traceability"
  persona: general
  channel: cli
  tags: [provenance]
  turns:
    - user: "把这个结论和我给的两个网页出处绑一下，注明来源。"
      tool_calls:
        - {name: attach_provenance, args: {
             artifact_uri: "artifact://note-1",
             sources: [{title: "来源 A", url: "https://a.example.com"},
                       {title: "来源 B", url: "https://b.example.com"}]}}
      expect:
        provenance_capsule: complete

# L4 journey (self-review): a clean first answer passes review on the first try —
# self-review adds no friction when the answer is already good (revises == 0).
- id: gen_self_review_passes_clean_answer
  title: "General user: a satisfactory answer passes review without rework"
  persona: general
  channel: cli
  tags: [self_review]
  turns:
    - user: "帮我把这段话精简成一句话。"
      review:
        - {verdict: pass, score: 0.95, notes: "简洁准确，达标"}
      expect:
        self_review: passed

# L4 journey (literature): everyday user wants sources on a topic; one connector
# is enough — the agent still fetches and files them for later reference.
- id: gen_literature_lookup_one_source
  title: "General user: retrieve references and index them into the corpus"
  persona: general
  channel: cli
  tags: [literature]
  turns:
    - user: "帮我查几篇讲向量数据库的资料。"
      tool_calls:
        - {name: search_literature, args: {query: "vector database", sources: ["openalex"]}}
      expect:
        literature: indexed

# L4 journey (skill_routing): an everyday architecture request reaches the
# lightweight DOT/SVG/PNG provider rather than either PPTX route.
- id: gen_skill_routing_scientific_figure
  title: "General user: ordinary architecture diagram resolves scientific-figure"
  persona: general
  channel: cli
  tags: [skill_routing]
  turns:
    - user: "帮我画一张普通的服务架构图，输出 SVG 就可以。"
      plan:
        intent_type: single_skill_task
        required_capabilities: [artifact.figure]
        capability_inputs:
          artifact.figure:
            input: "Draw a lightweight service architecture diagram as SVG."
        outputs: [artifact.figure]
        execution_mode: background
        confidence: 0.94
        rationale: "The request requires an ordinary lightweight architecture diagram."
      expect:
        skill_selected: scientific-figure

# L4 journey (compute): an everyday user asks for a quick computation; the owner
# approves once and it runs on the default (local) backend. The everyday path
# needs no cluster — compute defaults to local and just works.
- id: gen_compute_local_quick_run
  title: "General user: run a small computation on the default local backend"
  persona: general
  channel: cli
  tags: [compute, safety]
  turns:
    - user: "帮我算一下这个脚本的输出。"
      approve: once
      tool_calls:
        - {name: run_compute, args: {command: "echo 42"}}
      expect:
        safety: allowed
        compute: ran

# L4 journey (recall): the everyday user has a handful of remembered notes; recall
# stays functional (it surfaces them) — the bound never gets in the way of small,
# normal stores.
- id: gen_recall_functional_small_store
  title: "General user: recall remains effective with a small memory store"
  persona: general
  channel: cli
  tags: [recall]
  turns:
    - user: "根据我之前记的东西，帮我看看。"
      seed_memories: 4
      expect:
        recall: functional

# L4 journey (cost): even an everyday question is metered — the ``cost.usage``
# event makes spend visible for normal use, not just research runs.
- id: gen_cost_recorded_for_everyday_turn
  title: "General user: everyday turns record visible cost usage"
  persona: general
  channel: cli
  tags: [cost]
  turns:
    - user: "帮我把这段话改得更通顺一点，并解释一下改动。"
      expect:
        cost: recorded

# L4 journey (retry): an everyday background task hits a transient network blip
# and self-heals via auto-retry — the everyday user never sees the flake.
- id: gen_retry_transient_task_auto_heals
  title: "General user: a transient background-task failure retries automatically"
  persona: general
  channel: cli
  tags: [retry]
  turns:
    - user: "帮我在后台整理一下这个资料。"
      submit_task: {capability: research.ideation, mode: transient, input: {input: "organize research directions"}}
      expect:
        retry: auto

# L4 journey (fork): a user wants to try a different direction in a chat without
# losing the current one — forking copies the conversation into a new branch so
# they can keep both. Exercises the ``fork`` dimension for everyday use.
- id: gen_fork_try_alternative
  title: "General user: fork a conversation to try an alternative without overwriting it"
  persona: general
  channel: cli
  tags: [fork]
  turns:
    - user: "帮我拟一个周末出游的计划，先按海边来。"
    - user: "我想再单独试试山里的版本，别覆盖海边这版。"
      fork: true
      expect:
        fork: copied

# L4 journey (schedule): an everyday user asks for a recurring reminder-style job;
# when due it fires and re-arms — self-driving without the user re-asking.
- id: gen_schedule_recurring_reminder
  title: "General user: a recurring schedule fires when due and re-arms"
  persona: general
  channel: cli
  tags: [schedule]
  turns:
    - user: "帮我每小时定时整理一次收集到的资料。"
      schedule: {capability: research.ideation, kind: interval, interval_s: 3600, input: {input: "hourly research digest"}}
      expect:
        schedule: recurring

# L4 journey (streaming): an everyday answer streams in progressively so the user
# sees it forming instead of waiting for the whole block.
- id: gen_streaming_answer_renders_progressively
  title: "General user: everyday answers render progressively"
  persona: general
  channel: cli
  tags: [streaming]
  turns:
    - user: "帮我解释一下『温故而知新』这句话的意思。"
      stream: true
      answer: "『温故而知新』出自《论语》，意思是在温习旧的知识时，能从中获得新的理解与体会。它强调复习不是机械重复，而是在回顾中不断产生新的领悟，因此可以拿来做别人的老师。"
      expect:
        streaming: progressive

# L4 journey (memory graph): a fresh note gets auto-linked to a related earlier one,
# so the two connect across sessions. Exercises the ``memory_graph`` dimension.
- id: gen_memory_graph_links_related_notes
  title: "General user: related notes are linked by the memory graph"
  persona: general
  channel: cli
  tags: [memory_graph]
  turns:
    - user: "把我记的这些相关小笔记关联起来，以后好一起想起来。"
      expect:
        memory_graph: linked
