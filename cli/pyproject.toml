[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "OmniScientist-V2"
dynamic = ["version"]
description = "OmniScientist V2 — a local-first, CLI-first open-source personal research agent (Codex/Claude-Code compatible skills, WeChat/Feishu/DingTalk channels)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "OmniScientist Contributors" }]
keywords = ["research-agent", "cli", "llm", "skills", "mcp", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "typer>=0.12",
    "click>=8.1",  # imported directly in cli/main.py (Typer no longer pins it)
    "rich>=13.7",
    "prompt-toolkit>=3.0.52",
    "pyyaml>=6.0",
    "qrcode>=8.0",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    "packaging>=23.0",  # PEP 440 version comparison for the update checker
    "jsonschema>=4.21",
    # Windows has no system IANA tz database; zoneinfo falls back to this package.
    # Harmless on macOS/Linux (system zoneinfo is preferred when present).
    "tzdata>=2024.1",
    # Active bundled Skills are ready after one normal installation. Their
    # platform-neutral Python runtimes are product dependencies, not task-time
    # downloads; research-pptx's native Node modules are prepared by init/update.
    "python-pptx>=1.0.2",
    "matplotlib>=3.8",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "json-repair>=0.61.6,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
vec = [
    "sqlite-vec>=0.1.3",  # retained for Omni's unrelated global-memory backend
    "faiss-cpu>=1.14.3",  # paper-review historical-memory exact cosine index
]
# Optional retrieval-depth enhancers (P0-B′/P1-D′). All have pure-offline
# fallbacks, so omni stays local-first without them.
pdf = ["pypdf>=4.0"]          # PDF full-text ingestion (falls back to abstracts)
tokens = ["tiktoken>=0.7"]    # true tokenizer counting (falls back to a heuristic)
compute = ["modal>=0.63"]     # Modal compute backend (ssh/slurm use system binaries)
# Compatibility aliases retained for existing install commands. The active
# Skill runtimes above are now installed by the base product.
livefigure = []
research-pptx = []
# Uses the base httpx dependency; preserve the named extra for install compatibility.
research-ideation = []
channels = [
    "lark-oapi>=1.6.8",
    "dingtalk-stream>=0.24.3",
    "cryptography>=42",  # WeChat iLink CDN media (AES-128-ECB upload/download)
]
web = [
    "starlette>=0.41",
    "uvicorn>=0.32",
]
dev = [
    "coverage>=7.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "cryptography>=42",  # exercise the WeChat media crypto path offline
]
all = [
    "mcp>=1.2",
    "sqlite-vec>=0.1.3",
    "faiss-cpu>=1.14.3",
    "pypdf>=4.0",
    "tiktoken>=0.7",
    "modal>=0.63",
    "lark-oapi>=1.6.8",
    "dingtalk-stream>=0.24.3",
    "cryptography>=42",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.scripts]
omni = "omni.cli.main:app"

[project.urls]
Homepage = "https://github.com/tsinghua-fib-lab/OmniScientist-V2"
Documentation = "https://github.com/tsinghua-fib-lab/OmniScientist-V2/tree/master/cli/docs"
Repository = "https://github.com/tsinghua-fib-lab/OmniScientist-V2"
Issues = "https://github.com/tsinghua-fib-lab/OmniScientist-V2/issues"

# Single source of truth for the version: ``omni.__version__``. ``omni update``
# and the startup update-checker both read/compare this same value.
[tool.hatch.version]
path = "src/omni/__init__.py"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/omni"]
artifacts = [
    "src/omni/data/**/*.md",
    "src/omni/data/**/*.toml",
    "src/omni/data/**/*.json",
    "src/omni/data/**/*.yaml",
    "src/omni/data/skills/**/*",
    "src/omni/data/web/**/*",
]

# The built-in skills are a *separate* top-level collection (``<repo>/skills``),
# a sibling of this Python project (``<repo>/cli``) so CLI code and skill content
# stay independent. A custom build hook (``hatch_build.py``) force-includes that
# sibling into the wheel under ``omni/data/skills``, and the prebuilt loopback
# SPA under ``omni/data/web`` when ``web/dist`` exists (CI runs
# ``cli/scripts/build_web_ui.sh`` first). Paper Review's review corpora and
# derived FAISS generations are deliberately excluded from both wheel and sdist
# artifacts; first use fetches them from the pinned data-only Git repository.
# Editable/source checkouts resolve the sibling (including its Git-tracked data)
# at runtime (see ``omni/data/__init__.py``).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "src",
    "tests",
    "docs",
    "skills",
    "hatch_build.py",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "release_gate: evidence-heavy release criteria run by the dedicated CI gate",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]
